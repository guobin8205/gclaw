model:
  default: deepseek-v4-flash
  providers:
    deepseek:
      keys:
        - ${DEEPSEEK_API_KEY}
      base_url: https://api.deepseek.com
      models:
        - deepseek-v4-flash
        - deepseek-v4-pro
    zhipu:
      keys:
        - ${ZHIPU_API_KEY}
      base_url: https://open.bigmodel.cn/api/paas/v4
      endpoint: /chat/completions
      models:
        - glm-4-flash
        - glm-4-plus
    ark:
      keys:
        - ${ARK_API_KEY}
      base_url: https://ark.cn-beijing.volces.com/api/v3
      models:
        - doubao-1.5-pro-32k
        - doubao-1.5-pro-256k
agent:
  autonomy: interactive
  max_turns: 100
context:
  max_tokens: 128000
  compact_at: 0.8
