model:
  default: deepseek-v4-flash
  providers:
    deepseek:
      keys:
        - sk-f259b4537625480dab3e8a013eba3d64
      base_url: https://api.deepseek.com
      models:
        - deepseek-v4-flash
        - deepseek-v4-pro
    zhipu:
      keys:
        - 804f7dca94d44b47a89435c11bfeb60e.lZVD7izzTDYCewOa
      base_url: https://open.bigmodel.cn/api/paas/v4
      endpoint: /chat/completions
      models:
        - glm-4-flash
        - glm-4-plus
    ark:
      keys:
        - ark-c3f70e72-5ab9-40ec-a194-3bfbbc2e534e-b2f3d
      base_url: https://ark.cn-beijing.volces.com/api/v3
      models:
        - doubao-1.5-pro-32k
        - doubao-1.5-pro-256k
agent:
  autonomy: interactive
  max_turns: 100
context:
  max_tokens: 128000
  compact_at: 0.8
checkpoint:
  enabled: true
  max_snapshots: 50
cron:
  enabled: true
  script_timeout: 120s
  scripts_dir: ~/.gclaw/scripts
  jobs:
    - name: test-noagent
      schedule: "0 0 * * *"
      prompt: "test cron no-agent mode"
      enabled: true
      script: test-noagent.sh
memory:
  enabled: true
  dir: ~/.gclaw/memory
  prefetch_limit: 10
delegate:
  enabled: true
  max_concurrent: 3
  max_depth: 2
  default_timeout: 5m
